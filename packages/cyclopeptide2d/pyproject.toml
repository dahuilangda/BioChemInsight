[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclopeptide2d"
version = "0.1.0"
description = "Constrained peptide graph optimization for 2D depiction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "rdkit>=2023.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
sequence = ["peptidecore>=0.1.0"]

[project.scripts]
cyclopeptide2d = "cyclopeptide2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
