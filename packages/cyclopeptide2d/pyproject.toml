[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclopeptide2d"
version = "0.1.0"
description = "Joint residue-pose optimization for cyclic peptide 2D depiction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "rdkit>=2023.9"]

[project.scripts]
cyclopeptide2d = "cyclopeptide2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
